# orca settings — edit freely, commit with the project.
# format/lint/test: one shell command per key; `off` disables the gate. Delete the stack lines (or the whole file) to re-run auto-discovery.
# planningAgent/codingAgent/reviewAgent (harness[:model]): override the global settings file; a flow's own code overrides both.
# No formatter is wired into the build: .scalafmt.conf exists (version 3.10.7, scala3 dialect), but project/plugins.sbt declares no sbt-scalafmt plugin and no other format task or script is present, so scalafmt is not set up for this project.
format = off
# build.sbt; Compiles main and test sources without running tests. Test-scoped deps (zio-test, zio-test-sbt, munit, opentelemetry-sdk-testing) and test sources under src/test/scala justify it. Test/compile is a core sbt task; sbt version is pinned in project/build.properties (2.0.6). CI runs only `sbt compile` (.github/workflows/ci.yml line 22), which skips test sources, so this is the cheapest command covering tests.
lint = sbt Test/compile
# build.sbt; Runs the suites under src/test/scala (zio-test via zio-test-sbt, and munit). Test framework dependencies are declared at build.sbt lines 59-60 and 68. CI does not run tests; this is justified by the declared test dependencies and test sources.
test = sbt test
